<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="wicked-editor" content="wicked-video">
<meta name="wicked-editor-version" content="__VERSION__">
<title>Video</title>
<style>
:root{--surface-base:#fff;--surface-card:#f6f7f9;--surface-raised:#fff;--ink-high:#0d1117;--ink-body:#2b333d;--ink-muted:#5b6673;--border:#d5dae1;--accent:#224a5e;--font-sans:system-ui,sans-serif}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font:13px var(--font-sans);background:var(--surface-base);color:var(--ink-high)}[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}button{border:1px solid var(--border);border-radius:6px;background:var(--surface-raised);padding:7px 10px;cursor:pointer}button:disabled{opacity:.5;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.video-editor{display:grid;grid-template-columns:240px minmax(0,1fr);height:100%;outline:none}.chapters{padding:16px 12px;overflow:auto;background:var(--surface-card);border-right:1px solid var(--border)}h2{font-size:14px;margin:0 0 12px}ol{list-style:none;padding:0;margin:0;display:grid;gap:8px}.chapter{width:100%;text-align:left;display:flex;gap:8px;align-items:center}.chapter[aria-current=true],.chip[aria-current=true],.segment[aria-current=true]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface-card))}.number{color:var(--ink-muted);font-variant-numeric:tabular-nums}.duration{margin-left:auto;font-size:11px;color:var(--ink-muted)}
.work{min-width:0;min-height:0;padding:16px;display:flex;flex-direction:column;gap:12px;overflow:auto}.player{container-type:inline-size;position:relative;aspect-ratio:16/9;background:var(--video-background,#0b1020);flex:none;max-height:calc(100vh - 150px);width:100%;overflow:hidden;border-radius:8px}.player video{width:100%;height:100%;object-fit:contain;display:block}.unavailable{position:absolute;inset:0;display:grid;place-items:center;color:var(--video-foreground,#fff);padding:24px;text-align:center}.caption{position:absolute;left:10%;right:10%;text-align:center;white-space:pre-line;color:var(--video-foreground,#fff);font-family:var(--video-font,system-ui),system-ui,sans-serif;font-size:max(9px,calc(var(--caption-px,36) / 1080 * 56.25cqw));line-height:1.3;pointer-events:none;overflow:hidden}.caption[data-position=bottom]{bottom:8%}.caption[data-position=top]{top:8%}.caption[data-look=bar]{background:var(--video-background,#0b1020);padding:8px 12px;border-radius:4px}.caption[data-look=outline]{text-shadow:1px 1px 2px #000,-1px -1px 2px #000}
.transport{display:flex;align-items:center;gap:12px}.chips{display:flex;gap:6px;overflow-x:auto;flex:none}.chip{border-radius:999px;white-space:nowrap;padding:5px 9px}.timeline{display:flex;gap:4px;min-height:52px;flex:none}.segment-box{position:relative;min-width:32px}.segment{width:100%;height:52px;text-align:left;overflow:hidden;white-space:nowrap;background:var(--surface-card);border-top:3px solid var(--video-accent,var(--accent))}.trim-handle{position:absolute;top:2px;bottom:2px;width:10px;cursor:ew-resize;padding:0;background:var(--accent);touch-action:none;border:0}.trim-handle[data-edge=in]{left:0}.trim-handle[data-edge=out]{right:0}.editor-fields{display:grid;gap:10px;margin-top:16px}.buttons{display:flex;gap:6px;flex-wrap:wrap}label{display:grid;gap:5px;color:var(--ink-muted)}input,select,textarea{width:100%;padding:7px;border:1px solid var(--border);border-radius:5px;background:var(--surface-raised);color:var(--ink-high)}.trim-fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}.hint,.status{font-size:12px;color:var(--ink-muted);line-height:1.5;margin:8px 0}.inspectors{padding:16px;border-left:1px solid var(--border);overflow:auto;background:var(--surface-card)}.inspectors textarea{resize:vertical;min-height:100px}.summary{line-height:1.6;white-space:pre-line}.video-editor[data-mode=advanced][data-surface=full]{grid-template-columns:240px minmax(0,1fr) 280px}
.video-editor[data-surface=card]{grid-template-columns:1fr}.video-editor[data-surface=card] .work{padding:0;gap:6px}.video-editor[data-surface=card] .player{border-radius:0;max-height:calc(100vh - 70px);flex:1;min-height:0}.video-editor[data-surface=card] .transport{padding:0 8px}.video-editor[data-surface=options]{grid-template-columns:1fr}.video-editor[data-surface=options] .chapters{border:0}
.timeline{position:relative}.timeline[data-proof=true]{padding-bottom:24px}.check-track{position:absolute;bottom:0;left:10px;right:10px;height:20px}.check-mark{position:absolute;transform:translateX(-50%);padding:0 3px;height:20px;min-width:12px;border:0;border-radius:2px;border-left:2px solid currentColor;background:var(--surface-raised);color:var(--ink-muted)}.check-mark[data-state=FAIL],.chapter-verdict[data-verdict=FAIL],#check-list [data-state=FAIL]{color:#b42318}.check-mark[data-state=PASS],.chapter-verdict[data-verdict=PASS]{color:#18794e}#proof{margin-bottom:20px}#check-list{font-size:12px;line-height:1.5;overflow-wrap:anywhere}textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media(max-width:850px){.video-editor[data-mode=advanced][data-surface=full]{grid-template-columns:200px minmax(0,1fr)}.inspectors{grid-column:2;border-left:0}.video-editor[data-surface=full]{grid-template-columns:200px minmax(0,1fr)}}
</style></head><body><script>__PLUGIN__</script></body></html>
