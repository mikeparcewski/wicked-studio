<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="wicked-editor" content="wicked-insights">
<meta name="wicked-editor-version" content="__VERSION__">
<title>Run insights</title>
<style>
  /* The host's tokens arrive in host.hello / host.theme; these are plain fallbacks. */
  :root {
    --surface-base: #ffffff; --surface-card: #f6f7f9; --ink-high: #0d1117; --ink-body: #2b333d; --ink-muted: #5b6673;
    --border: #d5dae1; --accent: #224a5e; --status-pass: #1a7f4b; --status-fail: #b4232c; --status-warn: #9a6700;
    --font-sans: system-ui, sans-serif;
  }
  html, body { margin: 0; }
  body { font: 14px/1.45 var(--font-sans); color: var(--ink-body); background: var(--surface-base); }
  [hidden] { display: none !important; }
  main { max-width: 980px; margin: 0 auto; padding: 20px 20px 40px; display: flex; flex-direction: column; gap: 28px; }
  h1 { margin: 0; font-size: 20px; color: var(--ink-high); }
  h2 { margin: 0 0 10px; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); }
  .lede { margin: 6px 0 0; color: var(--ink-body); }
  .muted { color: var(--ink-muted); }
  .note { margin: 6px 0 0; font-size: 13px; color: var(--ink-muted); }
  .cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 20px; margin-top: 18px; }
  @media (max-width: 720px) { .cols { grid-template-columns: minmax(0, 1fr); } main { padding: 14px 12px 32px; } }
  ul.plain { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .good { padding: 10px 12px; border-radius: 10px; background: var(--surface-card); }
  .good::before { content: ''; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--status-pass); margin-right: 8px; vertical-align: 1px; }
  .rec { padding: 12px 14px; border-radius: 12px; background: var(--surface-card); border: 1px solid transparent; cursor: pointer; text-align: left; width: 100%; font: inherit; color: inherit; display: flex; flex-direction: column; gap: 4px; }
  .rec:hover { border-color: var(--border); }
  .rec:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .rec[aria-pressed="true"] { border-color: var(--accent); }
  .rec .t { font-weight: 600; color: var(--ink-high); }
  .rec .row { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12px; color: var(--ink-muted); }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--border); font-size: 12px; }
  .pill[data-state="accepted"] { color: var(--status-pass); border-color: currentColor; }
  .pill[data-state="dismissed"] { color: var(--ink-muted); }
  .trends { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
  .chart { padding: 12px; border-radius: 12px; background: var(--surface-card); }
  .chart .t { font-weight: 600; color: var(--ink-high); font-size: 13px; }
  .chart .v { font-size: 12px; color: var(--ink-muted); }
  .chart svg { display: block; width: 100%; height: 96px; margin-top: 6px; }
  .band { fill: color-mix(in srgb, var(--accent) 16%, transparent); }
  .line { fill: none; stroke: var(--accent); stroke-width: 2; }
  .pt { fill: var(--accent); }
  .pt.small { fill: var(--ink-muted); opacity: .55; }
  .lbl { font-size: 10px; fill: var(--ink-muted); }
  .axis { font-size: 10px; fill: var(--ink-muted); }
  .history button { font: inherit; color: inherit; background: none; border: 0; padding: 8px 10px; border-radius: 8px; width: 100%; text-align: left; cursor: pointer; display: flex; justify-content: space-between; gap: 12px; }
  .history button:hover { background: var(--surface-card); }
  .history button[aria-current="true"] { background: var(--surface-card); font-weight: 600; }
  .empty { padding: 16px; border-radius: 12px; background: var(--surface-card); }
</style>
</head>
<body>
<script>__PLUGIN__</script>
</body>
</html>
