<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- The bundle's own policy (the host frames it from a blob: URL, so no response header carries one): no network of
     any kind, no forms, no base, no workers. The same lines as crew's editor bundle policy (editors/csp.ts). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'; worker-src 'none'; manifest-src 'none'">
<meta name="wicked-editor" content="wicked-phase-report">
<meta name="wicked-editor-version" content="__VERSION__">
<title>Phase report</title>
<style>
  /* The host's tokens arrive in host.hello / host.theme; these are plain fallbacks. */
  :root {
    --surface-base: #0d1117; --surface-card: #161b22; --surface-raised: #1c222b; --ink-high: #f0f3f6; --ink-body: #c9d1d9;
    --ink-muted: #8b949e; --border: #30363d; --accent: #58a6ff; --status-ok: #3fb950; --status-fail: #f85149;
    --font-sans: system-ui, sans-serif;
  }
  html, body { margin: 0; padding: 0; background: var(--surface-card); }
  /* The host caps the block's height: anything taller scrolls inside the frame, never clipped. */
  body { font: 13px/1.45 var(--font-sans), system-ui, sans-serif; color: var(--ink-body); overflow-x: hidden; }
  [hidden] { display: none !important; }
  button.sum {
    all: unset; box-sizing: border-box; display: flex; align-items: center; gap: 8px; width: 100%; min-height: 34px;
    padding: 6px 2px; cursor: pointer; color: var(--ink-high); font-weight: 500; border-radius: 6px;
  }
  button.sum:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .sum-text { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .expanded .sum-text { white-space: normal; }
  .dot { flex: 0 0 auto; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
  .dot.wait { background: #d29922; }
  .dot.done { background: var(--status-ok); }
  .dot.bad { background: var(--status-fail); }
  .dash { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; padding: 4px 0 8px; }
  @media (max-width: 520px) { .dash { grid-template-columns: minmax(0, 1fr); } }
  .tile { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; background: var(--surface-raised); min-width: 0; }
  .tile.wide { grid-column: 1 / -1; }
  .label { display: block; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); margin-bottom: 4px; }
  .value { margin: 0; color: var(--ink-high); font-size: 15px; font-weight: 600; }
  .sub { margin: 2px 0 0; color: var(--ink-muted); font-size: 12px; }
  .run { margin-top: 6px; }
  .run + .run { border-top: 1px solid var(--border); padding-top: 6px; }
  .run-title { margin: 0 0 4px; font-size: 12px; color: var(--ink-body); }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; font-size: 12px; border: 1px solid var(--border); color: var(--ink-body); }
  .chip.ok { color: var(--status-ok); border-color: color-mix(in srgb, var(--status-ok) 45%, transparent); }
  .chip.bad { color: var(--status-fail); border-color: color-mix(in srgb, var(--status-fail) 45%, transparent); }
  .chip .re { color: var(--ink-muted); font-size: 11px; }
  ul.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; }
  ul.list li { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; }
  ul.list li span:first-child { flex: 0 0 auto; }
  ul.list li span:last-child { color: var(--ink-muted); text-align: right; min-width: 0; }
  ul.list li.open span:first-child { color: var(--ink-high); font-weight: 600; }
  .gap { margin: 0 0 6px; font-size: 12px; color: var(--status-fail); }
  .rg { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: 2px 0; font-size: 12px; color: var(--ink-muted); }
  .rg-arrow { color: var(--ink-muted); }
  .rg-chip { display: inline-flex; align-items: center; height: 18px; padding: 0 8px; border-radius: 999px; border: 1px solid var(--border); color: var(--ink-body); font-weight: 600; font-size: 11px; }
  .rg-chip.rg-high, .rg-chip.rg-highest { color: var(--status-warn, #d29922); border-color: color-mix(in srgb, var(--status-warn, #d29922) 55%, transparent); }
  /* The working document (spike 3) */
  #wd { border: 1px solid var(--border); border-radius: 10px; background: var(--surface-raised); padding: 10px 12px 12px; margin: 0 0 8px; }
  .wd-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .wd-title { margin: 0; font-size: 14px; color: var(--ink-high); }
  .wd-ver { font-size: 12px; color: var(--ink-muted); }
  .wd-note { margin: 2px 0 8px; font-size: 12px; color: var(--ink-muted); }
  .wd-sec { padding: 6px 0; border-top: 1px solid var(--border); }
  .wd-sec h4 { margin: 0 0 3px; display: flex; justify-content: space-between; gap: 8px; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); }
  .wd-who { font-weight: 400; letter-spacing: 0; text-transform: none; }
  .wd-text { white-space: pre-wrap; overflow-wrap: anywhere; color: var(--ink-body); border-radius: 6px; padding: 2px 4px; margin: 0 -4px; cursor: text; min-height: 1.4em; max-height: 18em; overflow-y: auto; }
  .wd-now { margin: 0 0 4px; padding: 4px 6px; border-radius: 6px; background: var(--surface-card); white-space: pre-wrap; font-size: 12px; color: var(--ink-high); max-height: 10em; overflow-y: auto; }
  .wd-text:hover { background: var(--surface-card); }
  .wd-text:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .wd-text.empty { color: var(--ink-muted); font-style: italic; }
  .wd-gen { display: block; color: var(--ink-body); }
  .wd-gen::after { content: ' · from the job’s events, not saved yet'; color: var(--ink-muted); font-size: 11px; }
  .wd-input { box-sizing: border-box; width: 100%; font: inherit; color: var(--ink-high); background: var(--surface-card); border: 1px solid var(--accent); border-radius: 6px; padding: 6px 8px; resize: vertical; }
  .wd-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 6px; }
  .wd-btn { font: inherit; font-size: 12px; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--border); background: transparent; color: var(--ink-body); cursor: pointer; }
  .wd-btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg, #fff); }
  .wd-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .wd-effect { font-size: 12px; color: var(--ink-muted); }
  .wd-status { margin: 8px 0 0; font-size: 12px; color: var(--ink-body); }
  .wd-status.bad { color: var(--status-fail); }
  .wd-trail { list-style: none; margin: 8px 0 0; padding: 6px 0 0; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: var(--ink-muted); }
</style>
</head>
<body>
<main id="root" class="folded">
  <button type="button" class="sum" id="sum" aria-expanded="false" aria-controls="dash">
    <span class="dot" id="dot" aria-hidden="true"></span><span class="sum-text" id="sum-text">Reading the job’s events…</span>
  </button>
  <section id="dash" class="dash" hidden aria-label="Phase report"></section>
  <section id="wd" hidden aria-label="Working document"></section>
</main>
<script>__PLUGIN__</script>
</body>
</html>
