<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="wicked-editor" content="wicked-page">
<meta name="wicked-editor-version" content="__VERSION__">
<title>Page editor</title>
<style>
  /* The plugin's own chrome takes the host's tokens (`host.hello.theme` / `host.theme`), with plain
     fallbacks for a host that passes none. The PAGE inside the nested frame styles itself. */
  :root {
    --surface-base: #ffffff; --surface-card: #f6f7f9; --ink-high: #0d1117; --ink-muted: #5b6673;
    --border: #d5dae1; --accent: #224a5e; --status-fail: #b4232c; --font-sans: system-ui, sans-serif;
  }
  html, body { height: 100%; margin: 0; }
  body { font: 13px var(--font-sans); color: var(--ink-high); background: var(--surface-base); overflow: hidden; }
  .editor { position: relative; width: 100%; height: 100%; outline: none; }
  .editor:focus { box-shadow: inset 0 0 0 2px var(--accent); }
  .stage { position: absolute; inset: 0; }
  .frame { display: block; width: 100%; height: 100%; border: 0; background: var(--surface-base); }
  body[data-size="inline"] .editor { pointer-events: none; }
  .box { position: absolute; pointer-events: none; border: 2px solid var(--accent); border-radius: 3px; box-sizing: border-box; }
  .box--hover { border-style: dashed; opacity: .55; }
  .handle { position: absolute; left: 0; top: 0; width: 1px; height: 1px; opacity: 0; }
  .input { position: absolute; box-sizing: border-box; font: inherit; line-height: 1.35; padding: 4px 6px; border: 2px solid var(--accent); border-radius: 3px; background: var(--surface-base); color: var(--ink-high); outline: none; z-index: 2; resize: none; overflow: auto; }
  .hint, .note { position: absolute; left: 8px; bottom: 8px; margin: 0; padding: 2px 8px; font-size: 12px; color: var(--ink-muted); background: var(--surface-card); border: 1px solid var(--border); border-radius: 4px; pointer-events: none; max-width: calc(100% - 32px); }
  .note { color: var(--status-fail); }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: no-preference) { .box { transition: left 80ms linear, top 80ms linear; } }
</style>
</head>
<body data-size="pane">
<script>__PLUGIN__</script>
</body>
</html>
