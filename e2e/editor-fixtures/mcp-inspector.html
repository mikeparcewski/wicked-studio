<!doctype html>
<html><head><meta charset="utf-8"><title>MCP inspector fixture editor</title>
<style>
  :root { --surface: #fff; --raised: #f3f5f8; --ink: #0d1117; --body: #2b3440; --muted: #59636e; --border: #d0d7de; --accent: #224a5e; --accent-fg: #fff; --fail: #b42318; --ok: #1a7f37; --font: system-ui, sans-serif; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font: 14px/1.45 var(--font); color: var(--body); background: var(--surface); }
  main { display: grid; grid-template-rows: auto auto minmax(0, 1fr); height: 100%; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 14px 18px; border-bottom: 1px solid var(--border); }
  #status { font-weight: 600; color: var(--ink); }
  #status[data-state="ready"]::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); margin-right: 8px; }
  #status[data-stale="1"] { color: var(--muted); }
  .note { color: var(--muted); font-size: 12px; margin: 0; }
  nav { display: flex; gap: 4px; padding: 10px 18px 0; border-bottom: 1px solid var(--border); }
  nav button { border: 0; background: none; padding: 8px 12px; font: inherit; color: var(--muted); border-bottom: 2px solid transparent; cursor: pointer; }
  nav button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
  .panes { display: grid; grid-template-columns: minmax(180px, 240px) minmax(0, 1fr); min-height: 0; }
  .panes > * { min-height: 0; overflow: auto; }
  #list { border-right: 1px solid var(--border); padding: 8px; display: flex; flex-direction: column; gap: 2px; margin: 0; list-style: none; }
  #list button { width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 8px; font: inherit; color: var(--body); cursor: pointer; }
  #list button[aria-current="true"] { background: var(--raised); color: var(--ink); font-weight: 600; }
  #list .desc { display: block; font-size: 12px; color: var(--muted); font-weight: normal; }
  #detail { padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
  h2 { margin: 0; font-size: 16px; color: var(--ink); }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--ink); }
  input, textarea { font: 13px ui-monospace, monospace; padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--raised); color: var(--ink); }
  button.primary { align-self: flex-start; border: 0; border-radius: 8px; padding: 8px 14px; background: var(--accent); color: var(--accent-fg); font: inherit; font-weight: 600; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  pre { margin: 0; padding: 10px 12px; background: var(--raised); border-radius: 8px; font: 12px/1.5 ui-monospace, monospace; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--ink); }
  #result[data-error="1"] { box-shadow: inset 3px 0 0 var(--fail); }
  .err { color: var(--fail); margin: 0; }
  #log { list-style: none; margin: 0; padding: 0; font: 12px/1.5 ui-monospace, monospace; }
  #log li { padding: 4px 0; border-bottom: 1px solid var(--border); overflow-wrap: anywhere; }
  #log .dir { display: inline-block; width: 2.2em; color: var(--muted); }
  #log li[data-error="1"] { color: var(--fail); }
  #log li.gap { color: var(--muted); font-style: italic; }
  .empty { color: var(--muted); }
  @media (max-width: 560px) {
    .panes { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
    #list { border-right: 0; border-bottom: 1px solid var(--border); flex-direction: row; flex-wrap: wrap; }
    #list button { width: auto; }
    #list .desc { display: none; }
    header, nav, #detail { padding-inline: 12px; }
  }
</style></head>
<body data-size="pane">
<main>
  <header>
    <span id="status" data-testid="plugin-status">Not connected</span>
    <p class="note" id="hint">Connect in studio, beside this inspector.</p>
  </header>
  <nav role="tablist" aria-label="What to inspect">
    <button type="button" role="tab" data-tab="tools" aria-selected="true">Tools</button>
    <button type="button" role="tab" data-tab="resources" aria-selected="false">Resources</button>
    <button type="button" role="tab" data-tab="prompts" aria-selected="false">Prompts</button>
    <button type="button" role="tab" data-tab="log" aria-selected="false">Log</button>
  </nav>
  <div class="panes">
    <ul id="list" aria-label="Items"></ul>
    <section id="detail" aria-live="polite"><p class="empty">Nothing to show yet.</p></section>
  </div>
</main>
<script>
(() => {
  const EDITOR = 'acme-mcp', VERSION = '0.1.0';
  const WORDS = {
    not_granted: 'Not allowed to talk to MCP servers.',
    unavailable: 'Not connected. Use Connect in studio.',
    bad_request: "This studio can't inspect MCP servers.",
  };
  let port = null, seq = 0, state = 'none', tab = 'tools', items = { tools: [], resources: [], prompts: [] }, current = null, lastSeq = null;
  const log = [];
  const pending = new Map();
  const $ = (id) => document.getElementById(id);
  const el = (tag, attrs, text) => { const e = document.createElement(tag); for (const [k, v] of Object.entries(attrs || {})) e.setAttribute(k, v); if (text !== undefined) e.textContent = text; return e; };
  const req = (type, payload) => new Promise((resolve) => {
    const id = 'r' + (++seq);
    pending.set(id, resolve);
    port.postMessage({ p: 'wicked.editor', v: 1, type, id, payload });
  });
  const mcp = (method, params) => req('mcp.request', params === undefined ? { method } : { method, params });
  const words = (r) => {
    const c = r.error.code;
    if (c === 'write_not_granted') return r.error.message + ' Enable it on the MCP tools page.';
    if (c === 'server_changed') return r.error.message + ' Restart to reconnect.';
    return WORDS[c] || (c + ': ' + r.error.message);
  };

  async function refresh() {
    if (state !== 'ready') return;
    const [t, r, p] = await Promise.all([mcp('tools/list'), mcp('resources/list'), mcp('prompts/list')]);
    items.tools = t.ok && t.payload.response.result ? t.payload.response.result.tools || [] : [];
    items.resources = r.ok && r.payload.response.result ? r.payload.response.result.resources || [] : [];
    items.prompts = p.ok && p.payload.response.result ? p.payload.response.result.prompts || [] : [];
    if (!t.ok) $('hint').textContent = words(t);
    drawList();
  }

  function drawList() {
    const list = $('list');
    list.textContent = '';
    if (tab === 'log') { list.appendChild(el('li', { class: 'empty' }, log.length + ' lines')); drawLog(); return; }
    const xs = items[tab];
    if (xs.length === 0) { list.appendChild(el('li', { class: 'empty' }, state === 'ready' ? 'None.' : 'Not connected.')); }
    for (const x of xs) {
      const li = el('li');
      const b = el('button', { type: 'button', 'data-item': x.name || x.uri }, x.name || x.uri);
      if (current && (current.name || current.uri) === (x.name || x.uri)) b.setAttribute('aria-current', 'true');
      if (x.description) b.appendChild(el('span', { class: 'desc' }, x.description));
      b.addEventListener('click', () => { current = x; drawList(); drawDetail(); });
      li.appendChild(b); list.appendChild(li);
    }
    if (!current || !xs.includes(current)) { current = null; $('detail').replaceChildren(el('p', { class: 'empty' }, xs.length ? 'Pick one.' : 'Nothing to show yet.')); }
  }

  function drawDetail() {
    const d = $('detail');
    d.textContent = '';
    if (!current) return;
    d.appendChild(el('h2', {}, current.name || current.uri));
    if (current.description) d.appendChild(el('p', { class: 'note' }, current.description));
    const out = el('pre', { id: 'result', 'data-testid': 'plugin-result' }, '');
    out.hidden = true;
    if (tab === 'tools') {
      const props = (current.inputSchema && current.inputSchema.properties) || {};
      const inputs = {};
      for (const [k, s] of Object.entries(props)) {
        const lab = el('label', {}, k + (s.type ? ' (' + s.type + ')' : ''));
        const inp = el('input', { 'data-arg': k, type: s.type === 'number' || s.type === 'integer' ? 'number' : 'text' });
        lab.appendChild(inp); d.appendChild(lab); inputs[k] = [inp, s.type];
      }
      const call = el('button', { type: 'button', class: 'primary', 'data-testid': 'plugin-call' }, 'Call ' + current.name);
      call.addEventListener('click', async () => {
        const args = {};
        for (const [k, [inp, t]] of Object.entries(inputs)) if (inp.value !== '') args[k] = t === 'number' || t === 'integer' ? Number(inp.value) : inp.value;
        const r = await mcp('tools/call', { name: current.name, arguments: args });
        show(out, r);
      });
      d.appendChild(call);
    } else if (tab === 'resources') {
      const read = el('button', { type: 'button', class: 'primary' }, 'Read it');
      read.addEventListener('click', async () => show(out, await mcp('resources/read', { uri: current.uri })));
      d.appendChild(read);
    } else if (tab === 'prompts') {
      const get = el('button', { type: 'button', class: 'primary' }, 'Get it');
      get.addEventListener('click', async () => show(out, await mcp('prompts/get', { name: current.name, arguments: {} })));
      d.appendChild(get);
    }
    d.appendChild(out);
  }

  function show(out, r) {
    out.hidden = false;
    if (!r.ok) { out.dataset.error = '1'; out.textContent = words(r); return; }
    const res = r.payload.response;
    out.dataset.error = res.error || (res.result && res.result.isError) ? '1' : '0';
    out.textContent = (res.error ? 'The server answered an error\n' : '') + JSON.stringify(res.error || res.result, null, 2) + '\n· ' + r.payload.ms + ' ms' + (r.payload.truncated ? ' · cut' : '');
  }

  function drawLog() {
    const d = $('detail');
    const ul = el('ul', { id: 'log', 'data-testid': 'plugin-log' });
    for (const e of log) {
      if (e.gap) { ul.appendChild(el('li', { class: 'gap' }, 'gap: ' + e.gap + ' lines evicted')); continue; }
      const li = el('li', { 'data-error': e.error ? '1' : '0', 'data-kind': e.kind });
      li.appendChild(el('span', { class: 'dir' }, e.dir === 'out' ? '→' : e.dir === 'in' ? '←' : '·'));
      li.appendChild(document.createTextNode((e.method || e.kind) + (e.ms !== undefined ? ' · ' + e.ms + ' ms' : '') + '  ' + e.text.slice(0, 240)));
      ul.appendChild(li);
    }
    d.replaceChildren(el('h2', {}, 'JSON-RPC log'), ul);
  }

  for (const b of document.querySelectorAll('nav button')) b.addEventListener('click', () => {
    tab = b.dataset.tab; current = null;
    for (const o of document.querySelectorAll('nav button')) o.setAttribute('aria-selected', String(o === b));
    drawList();
  });

  function onPort(m) {
    const d = m.data;
    try {
      if (!d || d.p !== 'wicked.editor' || d.v !== 1) return;
      if (d.re && pending.has(d.re)) { const r = pending.get(d.re); pending.delete(d.re); r(d); return; }
      switch (d.type) {
        case 'host.ping': port.postMessage({ p: 'wicked.editor', v: 1, re: d.id, ok: true, payload: {} }); break;
        case 'host.theme': theme(d.payload.theme || {}); break;
        case 'mcp.state': {
          const s = d.payload;
          state = s.state;
          const st = $('status');
          st.dataset.state = state;
          st.dataset.stale = state === 'closed' || state === 'failed' ? '1' : '0';
          st.textContent = state === 'ready' ? 'Connected to ' + ((s.server && s.server.name) || 'the server') : state === 'connecting' ? 'Connecting…' : state === 'none' ? 'Not connected' : state === 'failed' ? 'Failed: what is shown is stale' : 'Closed: what is shown is stale';
          $('hint').textContent = state === 'ready' ? (s.protocolVersion ? 'Protocol ' + s.protocolVersion : '') : state === 'none' ? 'Connect in studio, beside this inspector.' : state === 'connecting' ? '' : 'Restart in studio to reconnect.';
          if (state === 'ready') refresh(); else drawList();
          break;
        }
        case 'mcp.log': {
          for (const e of d.payload.entries || []) {
            if (lastSeq !== null && e.seq > lastSeq + 1) log.push({ gap: e.seq - lastSeq - 1 });
            lastSeq = e.seq; log.push(e);
          }
          if (log.length > 1000) log.splice(0, log.length - 1000);
          if (tab === 'log') drawList();
          break;
        }
        default: break;
      }
    } catch (err) { /* malformed host message: ignored */ }
  }

  function theme(t) {
    const map = { '--surface-card': '--surface', '--surface-raised': '--raised', '--ink-high': '--ink', '--ink-body': '--body', '--ink-muted': '--muted', '--border': '--border', '--accent': '--accent', '--accent-fg': '--accent-fg', '--status-fail': '--fail', '--status-ok': '--ok', '--font-sans': '--font' };
    for (const [k, v] of Object.entries(t)) if (map[k] && typeof v === 'string' && !/url\(/i.test(v)) document.documentElement.style.setProperty(map[k], v);
  }

  window.addEventListener('message', (e) => {
    if (port || !e.data || e.data.type !== 'host.hello' || !e.ports[0]) return;
    port = e.ports[0];
    port.onmessage = onPort;
    theme(e.data.payload.theme || {});
    document.body.dataset.size = e.data.payload.size;
    drawList();
  });
  // The journey's hostile probe: a tool call nobody clicked for (the host must refuse it).
  // Playwright's evaluate runs WITH a user gesture, so the call is made from a timer once that
  // gesture's transient activation (about 5 s) has expired; the result lands in window.__autoResult.
  window.__autoCall = (afterMs) => { window.__autoResult = null; setTimeout(async () => { const r = await mcp('tools/call', { name: 'echo', arguments: { text: 'unasked' } }); window.__autoResult = r.ok ? 'ok' : r.error.code; }, afterMs); };
  window.__listNow = async () => { const r = await mcp('tools/list'); return r.ok ? 'ok' : r.error.code; };
  parent.postMessage({ p: 'wicked.editor', v: 1, type: 'plugin.ready', payload: { editor: EDITOR, version: VERSION, protocol: [1] } }, '*');
})();
</script>
</body></html>
