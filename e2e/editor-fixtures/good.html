<!doctype html>
<html><head><meta charset="utf-8"><title>Good fixture editor</title>
<style>
  :root { --accent: #224a5e; --ink: #0d1117; --surface: #fff; }
  body { margin: 0; font: 14px system-ui, sans-serif; color: var(--ink); background: var(--surface); }
  main { padding: 10px 14px; }
  [data-wid] { display: block; padding: 3px 6px; margin: 2px 0; border-radius: 4px; outline: none; }
  [data-wid][aria-selected="true"] { box-shadow: 0 0 0 2px var(--accent); }
  [data-wid]:focus-visible, button:focus-visible { box-shadow: 0 0 0 2px var(--accent); }
  body[data-size="inline"] main { pointer-events: none; }
  p.note { color: #44515d; font-size: 12px; }
</style></head>
<body data-size="pane">
<main>
  <p class="note" id="mode">Loading…</p>
  <div id="doc" role="list" aria-label="The page's parts"></div>
  <button type="button" id="full">Full screen</button>
</main>
<script>
(() => {
  const EDITOR = 'acme-good', VERSION = '0.1.0';
  let port = null, grants = [], head = 0, seq = 0, selected = null;
  const pending = new Map();
  const env = (type, payload) => ({ p: 'wicked.editor', v: 1, type, payload });
  const req = (type, payload) => new Promise((resolve) => {
    const id = 'r' + (++seq);
    pending.set(id, resolve);
    port.postMessage({ p: 'wicked.editor', v: 1, type, id, payload });
  });
  const send = (type, payload) => { if (port) port.postMessage(env(type, payload)); };
  const say = (line) => send('ui.status', { line });

  function editable(el) { return el && el.isContentEditable; }
  async function render() {
    const r = await req('artifact.read', {});
    if (!r.ok) { document.getElementById('mode').textContent = 'Read not granted: ' + r.error.code; return; }
    head = r.payload.version;
    const tmp = new DOMParser().parseFromString(r.payload.content.html, 'text/html');
    const doc = document.getElementById('doc');
    doc.textContent = '';
    const canWrite = grants.includes('artifact.write');
    document.getElementById('mode').textContent = canWrite ? 'Click a part to point at it; double-click to edit; Enter saves.' : 'Read-only here.';
    for (const el of tmp.querySelectorAll('[data-wid]')) {
      if (el.querySelector('[data-wid]')) continue;
      const d = document.createElement('div');
      d.dataset.wid = el.getAttribute('data-wid');
      d.setAttribute('role', 'listitem');
      d.tabIndex = 0;
      d.textContent = el.textContent.trim();
      d.dataset.before = d.textContent;
      doc.appendChild(d);
    }
  }
  async function commit(d) {
    d.contentEditable = 'false';
    const value = d.textContent, before = d.dataset.before;
    if (value === before) return;
    const r = await req('version.write', { base: head, ops: [{ op: 'text', anchor: d.dataset.wid, value, before }], summary: 'the ' + d.dataset.wid.replace(/-/g, ' ') });
    if (r.ok) { head = r.payload.version; d.dataset.before = value; say('Saved as version ' + head); }
    else if (r.error.code === 'stale' || r.error.code === 'head_moved') { say('Not changed: it moved while you typed'); d.dataset.stale = '1'; }
    else { say('Not saved: ' + r.error.code); d.textContent = before; }
  }

  document.addEventListener('click', (e) => {
    const d = e.target.closest && e.target.closest('[data-wid]');
    if (!d) return;
    if (selected) selected.removeAttribute('aria-selected');
    selected = d; d.setAttribute('aria-selected', 'true');
    send('selection.set', { anchors: [{ kind: 'element', id: d.dataset.wid }] });
  });
  document.addEventListener('dblclick', (e) => {
    const d = e.target.closest && e.target.closest('[data-wid]');
    if (!d || !grants.includes('artifact.write')) return;
    d.contentEditable = 'true'; d.focus();
  });
  document.addEventListener('focusout', (e) => { if (editable(e.target)) commit(e.target); });
  document.getElementById('full').addEventListener('click', () => req('ui.fullscreen', {}));
  document.addEventListener('keydown', (e) => {
    const inEdit = editable(document.activeElement);
    if (inEdit && e.key === 'Enter') { e.preventDefault(); commit(document.activeElement); return; }
    if (inEdit) return;
    if (e.key === 'Escape') { send('ui.key', { key: 'Escape' }); return; }
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); send('ui.key', { key: 'Mod+K' }); return; }
    if (e.altKey && e.code && /^Key[A-Z]$/.test(e.code)) { e.preventDefault(); send('ui.key', { key: 'Alt+' + e.code.slice(3) }); return; }
    if (e.key === 'Tab') {
      const items = [...document.querySelectorAll('[data-wid], button')];
      const i = items.indexOf(document.activeElement);
      if ((!e.shiftKey && i === items.length - 1) || (e.shiftKey && i <= 0)) { e.preventDefault(); send('ui.key', { key: e.shiftKey ? 'Shift+Tab' : 'Tab' }); }
      return;
    }
    // Rule 2: the first printable key, outside an editable, goes to the composer — never an action.
    if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); send('ui.typed', { grapheme: e.key }); return; }
    // Backspace / Delete with a part selected and nothing being edited: nothing.
  });

  function onPort(m) {
    const d = m.data;
    try {
      if (!d || d.p !== 'wicked.editor' || d.v !== 1) return;
      if (d.re && pending.has(d.re)) { const r = pending.get(d.re); pending.delete(d.re); r(d); return; }
      switch (d.type) {
        case 'host.ping': port.postMessage({ p: 'wicked.editor', v: 1, re: d.id, ok: true, payload: {} }); break;
        case 'host.size': document.body.dataset.size = d.payload.size; if (d.payload.size === 'inline' && document.activeElement) document.activeElement.blur(); break;
        case 'host.theme': {
          const t = d.payload.theme || {};
          for (const [k, v] of Object.entries(t)) if (/^--[a-z-]+$/.test(k) && typeof v === 'string' && !/url\(/i.test(v)) document.documentElement.style.setProperty(k.replace('--surface-card', '--surface').replace('--ink-high', '--ink'), v);
          say('theme ' + (t['--accent'] || ''));
          break;
        }
        case 'artifact.changed': if (d.payload.by !== 'this-editor') render(); break;
        default: break; // unknown types are ignored (rule 8)
      }
    } catch (err) { /* malformed host message: ignored */ }
  }

  window.addEventListener('message', (e) => {
    if (port || !e.data || e.data.type !== 'host.hello' || !e.ports[0]) return;
    port = e.ports[0];
    port.onmessage = onPort;
    grants = e.data.payload.grants || [];
    document.body.dataset.size = e.data.payload.size;
    render();
  });
  parent.postMessage(env('plugin.ready', { editor: EDITOR, version: VERSION, protocol: [1] }), '*');
})();
</script>
</body></html>
