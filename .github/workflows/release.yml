# wicked-studio — npm release (studio#15).
#
# The daemon bundles studio's dist as its default local skin (`wicked-crew build:with-studio`),
# which today consumes this repo as a git dependency. Publishing the dist artifact to npm gives
# crew (and any other consumer) a public, auditable, semver-ranged dependency — the same
# argument that moved wicked-crew-api-types onto the registry.
#
# Self-contained rather than a wicked-ci caller for the same reason release-api-types.yml is:
# tokenless OIDC trusted publishing with `--provenance`, tag/manifest agreement guarded, and a
# post-publish registry probe.
#
# What gates the GitHub Release is the PUBLISH; the registry probe is advisory (studio#331). The
# probe still exists for FINDING-096 ("a green publish for something no operator can install is
# not a release") and it still reports — but registry lag is not a publish failure, and on v0.5.14
# it cost a good release its Release page. So it backs off over ~6 min and then WARNS.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # create the GitHub Release after a successful npm publish
  # OIDC trusted publishing — no NPM_TOKEN stored in this repo.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # tests/testidRemovals.test.ts diffs testid-inventory.json against a base commit and must not
      # skip in CI. A release tag sits on a main commit, so its base is the previous main commit,
      # the same base ci.yml's push run used: HEAD^1, fetched by depth 2. Without it the v0.6.0
      # tag's Test step failed ("no base commit") and nothing was published.
      TESTID_BASE_REF: HEAD^1
    steps:
      # SHA-pinned to match ci.yml — a release workflow is the last place to float an action tag.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      # npm 12 is the major that published wicked-core-ts / agent-acp-bridges /
      # wicked-crew-api-types through this tokenless OIDC path.
      - name: Upgrade npm (provenance-capable)
        run: npm install -g npm@12

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # The published artifact IS the dist (package.json files: ["dist"]).
      - name: Build
        run: npm run build

      - name: Tag and manifest must agree
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "  tag      : ${GITHUB_REF_NAME}  -> ${TAG_VERSION}"
          echo "  manifest : ${PKG_VERSION}"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} implies ${TAG_VERSION} but package.json says ${PKG_VERSION}. Bump the manifest and re-tag rather than publishing a version the tag does not name."
            exit 1
          fi

      - name: Publish to npm (trusted publisher + provenance)
        run: npm publish --access public --provenance

      # Registry lag is not a publish failure (studio#331): on v0.5.14 `npm publish` succeeded, this
      # probe 404'd through its 60 s window, and the GitHub Release was skipped — then the same
      # version resolved a minute later and the release had to be cut by hand. So the probe now
      # backs off over ~6 minutes and, if the registry is still lagging, reports a WARNING and
      # exits 0. The release page is advertised for a version npm accepted; the probe says whether
      # it was servable yet.
      - name: The registry can actually serve it
        id: serve_probe
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          # ~6 min total: 10+15+20+30+45+60+60+60+60 = 360 s of waiting across 10 attempts.
          BACKOFF="10 15 20 30 45 60 60 60 60"
          attempt=1
          for wait in $BACKOFF ""; do
            if npm view "wicked-studio@${TAG_VERSION}" version; then
              echo "  ok — obtainable from the registry (attempt ${attempt})"
              echo "served=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ -z "$wait" ]; then
              break
            fi
            echo "  not visible yet (attempt ${attempt}), waiting ${wait}s…"
            sleep "$wait"
            attempt=$((attempt + 1))
          done
          echo "served=false" >> "$GITHUB_OUTPUT"
          echo "::warning::wicked-studio@${TAG_VERSION} was published but is still not resolvable after ~6 min of retries (FINDING-096 registry lag). The GitHub Release is still cut; verify \`npm view wicked-studio@${TAG_VERSION} version\` before announcing."

      # Cut the GitHub Release after npm publish succeeds. The registry-serve probe above is a
      # report, not a gate (studio#331): a publish npm accepted but serves late must not leave the
      # Releases page empty. A failed *publish* still stops here, because the step before this one
      # is the publish itself. This is the step studio lacked: it published to npm every release but
      # never created a GitHub Release, so the Releases page stayed empty while npm shipped through
      # v0.4.14. Idempotent — an existing release (e.g. a hand-backfilled one) is updated in place.
      - name: Create the GitHub Release from CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # Notes = this version's CHANGELOG section. Distinguish "no section" (exit 1 → generic
          # note) from a real script failure (exit 2 → missing/unreadable CHANGELOG, usage bug),
          # which must FAIL rather than silently ship a generic note.
          set +e
          python3 scripts/changelog-section.py "$TAG" > /tmp/relnotes.md
          code=$?
          set -e
          if [ "$code" -eq 1 ]; then
            printf 'Release %s\n' "$TAG" > /tmp/relnotes.md
          elif [ "$code" -ne 0 ]; then
            echo "::error::changelog-section.py failed (exit $code) — refusing to publish a release with fallback notes"
            exit "$code"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file /tmp/relnotes.md
            echo "updated existing GitHub Release $TAG"
          else
            gh release create "$TAG" --title "$TAG" --notes-file /tmp/relnotes.md --verify-tag
            echo "created GitHub Release $TAG"
          fi
