# wicked-studio — npm release (studio#15).
#
# The daemon bundles studio's dist as its default local skin (`wicked-crew build:with-studio`),
# which today consumes this repo as a git dependency. Publishing the dist artifact to npm gives
# crew (and any other consumer) a public, auditable, semver-ranged dependency — the same
# argument that moved wicked-crew-api-types onto the registry.
#
# Self-contained rather than a wicked-ci caller for the same reason release-api-types.yml is:
# tokenless OIDC trusted publishing with `--provenance`, tag/manifest agreement guarded, and a
# post-publish registry probe.
#
# CI publishes to npm, waits until the registry serves the version, then drafts the Release.
# Re-run failed jobs for registry lag; never re-run a successful publish (EPUBLISHCONFLICT).
# After JOURNEY CERTIFIED, coord/operator publishes the draft and sets Latest locally:
# gh release edit <tag> --repo mikeparcewski/wicked-studio --draft=false --latest

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC trusted publishing
    env:
      # tests/testidRemovals.test.ts diffs testid-inventory.json against a base commit and must not
      # skip in CI. A release tag sits on a main commit, so its base is the previous main commit,
      # the same base ci.yml's push run used: HEAD^1, fetched by depth 2. Without it the v0.6.0
      # tag's Test step failed ("no base commit") and nothing was published.
      TESTID_BASE_REF: HEAD^1
    steps:
      # SHA-pinned to match ci.yml — a release workflow is the last place to float an action tag.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      # npm 12 is the major that published wicked-core-ts / agent-acp-bridges /
      # wicked-crew-api-types through this tokenless OIDC path.
      - name: Upgrade npm (provenance-capable)
        run: npm install -g npm@12

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # The published artifact IS the dist (package.json files: ["dist"]).
      - name: Build
        run: npm run build

      - name: Tag and manifest must agree
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "  tag      : ${GITHUB_REF_NAME}  -> ${TAG_VERSION}"
          echo "  manifest : ${PKG_VERSION}"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} implies ${TAG_VERSION} but package.json says ${PKG_VERSION}. Bump the manifest and re-tag rather than publishing a version the tag does not name."
            exit 1
          fi

      - name: Publish to npm (trusted publisher + provenance)
        run: npm publish --access public --provenance

  registry:
    name: wait until the registry serves the version
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Wait until the registry serves the version (up to 15 min)
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          # Refresh npm's cached packument and bound each lookup.
          started="$(date +%s)"
          deadline=$(( started + 15 * 60 ))
          attempt=0
          while :; do
            attempt=$(( attempt + 1 ))
            if served="$(timeout 60 npm view --prefer-online "wicked-studio@${VERSION}" version 2>/dev/null)" \
               && [ "$served" = "$VERSION" ]; then
              echo "  ok — wicked-studio@${VERSION} resolves after $(( $(date +%s) - started ))s (attempt ${attempt})"
              break
            fi
            now="$(date +%s)"
            if [ "$now" -ge "$deadline" ]; then
              echo "::error::the registry still does not serve wicked-studio at ${VERSION} after 15 minutes. The publish job succeeded, so this is npm's asynchronous processing, not a publish failure — re-run failed jobs (this one and the one after it), never the publish job (a second publish fails with EPUBLISHCONFLICT)."
              exit 1
            fi
            echo "  not yet: wicked-studio@${VERSION} — attempt ${attempt}, $(( now - started ))s elapsed of 15 min; next check in 30s"
            sleep 30
          done

  github-release:
    name: draft the GitHub Release (published after certification)
    needs: registry
    runs-on: ubuntu-latest
    permissions:
      contents: write # create this tag's draft Release
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Draft the GitHub Release from CHANGELOG
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "a GitHub Release for $TAG already exists (draft or published); left as it is"
            exit 0
          fi
          set +e
          python3 scripts/changelog-section.py "$TAG" > "$RUNNER_TEMP/relnotes.md"
          code=$?
          set -e
          if [ "$code" -eq 1 ]; then
            printf 'Release %s\n' "$TAG" > "$RUNNER_TEMP/relnotes.md"
            echo "::warning::CHANGELOG.md has no block for $TAG; the draft gets a generic note"
          elif [ "$code" -ne 0 ]; then
            echo "::error::changelog-section.py failed (exit $code); refusing to draft a Release with fallback notes"
            exit "$code"
          fi
          gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/relnotes.md"
