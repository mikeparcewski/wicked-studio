<title>Orchestrator Console</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#E6E9EE; --panel:#F5F6F8; --panel2:#ECEFF3; --raise:#FFFFFF;
  --ink:#111826; --ink2:#465163; --ink3:#788396; --line:#CAD1DB; --line2:#DDE2E9;
  --accent:#0E6A78; --accent-ink:#FFFFFF; --accent-soft:#D3E9EC;
  --wait:#A85A00; --wait-soft:#F6E5CC; --bad:#B1261B; --bad-soft:#F6DAD6; --ok:#2B7446; --ok-soft:#D5EBDC;
  --ghost:#6B4FC0; --ghost-soft:#E6E0F6;
  --dim:.36; --shadow:0 10px 30px rgba(17,24,38,.18);
  --ui:"IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --cond:"IBM Plex Sans Condensed", "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0E1217; --panel:#151A21; --panel2:#1B2129; --raise:#20272F;
    --ink:#E3E8EF; --ink2:#A7B1BF; --ink3:#748091; --line:#2D3642; --line2:#232A34;
    --accent:#5BC2CF; --accent-ink:#0E1217; --accent-soft:#143B41;
    --wait:#E7A547; --wait-soft:#3A2A12; --bad:#F2857A; --bad-soft:#401C19; --ok:#6CC28C; --ok-soft:#153322;
    --ghost:#B4A1F2; --ghost-soft:#2B2446;
    --dim:.34; --shadow:0 12px 32px rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#0E1217; --panel:#151A21; --panel2:#1B2129; --raise:#20272F;
  --ink:#E3E8EF; --ink2:#A7B1BF; --ink3:#748091; --line:#2D3642; --line2:#232A34;
  --accent:#5BC2CF; --accent-ink:#0E1217; --accent-soft:#143B41;
  --wait:#E7A547; --wait-soft:#3A2A12; --bad:#F2857A; --bad-soft:#401C19; --ok:#6CC28C; --ok-soft:#153322;
  --ghost:#B4A1F2; --ghost-soft:#2B2446;
  --dim:.34; --shadow:0 12px 32px rgba(0,0,0,.55);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
.ebar,.board,.cmd,.drawer{flex:none}
body{margin:0;background:var(--ground);color:var(--ink);font:14px/1.45 var(--ui);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
.mono{font-family:var(--mono);font-size:11.5px}
.k{font-family:var(--mono);font-size:10.5px;padding:0 5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;color:var(--ink2);background:var(--panel);white-space:nowrap;line-height:1.5}
.muted{color:var(--ink3)} .ink2{color:var(--ink2)}
.tab{font-variant-numeric:tabular-nums}
.c-wait{color:var(--wait)} .c-bad{color:var(--bad)} .c-ok{color:var(--ok)} .c-acc{color:var(--accent)} .c-ghost{color:var(--ghost)}
b,strong{font-weight:600}

/* ---------- walk-through header ---------- */
.walk{padding-inline:16px;padding-block:10px 8px;display:grid;gap:7px;border-bottom:1px solid var(--line)}
.walk>*{min-width:0}
.wtop{display:flex;gap:10px 14px;align-items:baseline;flex-wrap:wrap}
.wtop h1{margin:0;font:700 15px/1.2 var(--cond);letter-spacing:.02em;text-transform:uppercase}
.wtop .sub{color:var(--ink3);font-size:12.5px}
.wtop .sp{flex:1}
.navb{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:2px 9px;font-size:12px}
.moments{display:flex;gap:4px;overflow-x:auto;padding-bottom:3px;scrollbar-width:thin}
.mchip{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:5px;padding:3px 8px;font:500 12px/1.3 var(--cond);display:flex;gap:6px;align-items:baseline}
.mchip .t{font-family:var(--mono);font-size:10px;color:var(--ink3)}
.mchip[aria-current="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.mchip[aria-current="true"] .t{color:var(--ground);opacity:.7}
.cap{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12.5px;max-width:150ch}
.cap dt{font:600 10.5px/1.7 var(--cond);text-transform:uppercase;letter-spacing:.08em;color:var(--ink3)}
.cap dd{margin:0;color:var(--ink2)}
.cap dd b{color:var(--ink)}

/* ---------- console ---------- */
.console{display:flex;flex-direction:column;gap:6px;padding-inline:16px;padding-block:8px 10px}
.console>*{min-width:0}
.ebar{display:flex;align-items:center;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:6px}
.etab{border:1px solid transparent;background:transparent;border-radius:6px;padding:4px 10px;display:flex;align-items:center;gap:6px;font:600 13px var(--cond);color:var(--ink2)}
.etab[aria-current="true"]{background:var(--raise);border-color:var(--line);color:var(--ink)}
.etab .g{font-size:9px}
.ebar .grow{flex:1}
.posture{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel)}
.posture button{border:0;background:transparent;padding:3px 10px;font:500 12px var(--cond);color:var(--ink2)}
.posture button[aria-pressed="true"]{background:var(--ink);color:var(--ground)}
.tray{display:flex;gap:10px;align-items:center;font:12px var(--cond);color:var(--ink3);padding-inline:8px;flex-wrap:wrap}
.tray .lit{color:var(--wait);font-weight:600}

/* strip board */
.board{border:1px solid var(--line);background:var(--panel);border-radius:8px;overflow:hidden}
.bhead{display:flex;gap:10px;align-items:center;padding:4px 10px;font:600 10.5px var(--cond);letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);border-bottom:1px solid var(--line2)}
.bhead .r{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:500;font-size:11.5px}
.strip{display:grid;grid-template-columns:128px 92px minmax(0,1.5fr) minmax(0,1fr) 118px 186px;gap:10px;align-items:center;padding:3px 10px;min-height:27px;border-bottom:1px solid var(--line2);font:13px/1.3 var(--cond);width:100%;text-align:left;background:transparent;border-left:0;border-right:0;border-top:0;position:relative;transition:opacity .4s, transform .4s, background .2s}
.strip:last-child{border-bottom:0}
.strip:hover{background:var(--panel2)}
.strip[aria-selected="true"]{background:var(--accent-soft)}
.strip>*{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clock{font-family:var(--mono);font-size:11px;font-weight:600;display:flex;gap:6px;align-items:center}
.clock .g{font-size:9px}
.s-bad .clock{color:var(--bad)} .s-wait .clock{color:var(--wait)} .s-low .clock{color:var(--ink3)}
.strip .eng{color:var(--ink2);font-weight:600}
.strip .dec{font-weight:600}
.strip .eff{color:var(--ink2)}
.strip .who{color:var(--ink3);font-size:12px}
.strip .keys{display:flex;gap:4px;justify-content:flex-end;align-items:center}
.strip.grey{opacity:.42}
.strip.grey .dec{text-decoration:line-through}
.strip.group .dec::before{content:"▤ ";color:var(--ink3)}
.moved{position:absolute;right:196px;top:-1px;font:600 10px var(--mono);color:var(--accent);background:var(--panel);padding:0 4px}
.divider{display:flex;align-items:center;gap:8px;padding:2px 10px;font:600 10.5px var(--mono);color:var(--accent);border-bottom:1px solid var(--line2);background:var(--accent-soft)}
.more{padding:4px 10px;font:12px var(--cond);color:var(--ink3)}
.held{display:flex;gap:10px;align-items:center;padding:6px 10px;font:13px var(--cond);color:var(--ink2);flex-wrap:wrap}
.held b{font-family:var(--mono);font-size:12px}
.sbtn{border:1px solid var(--line);background:var(--raise);border-radius:4px;padding:0 6px;font:500 11.5px/1.6 var(--cond)}
.sbtn.pri{background:var(--ink);color:var(--ground);border-color:var(--ink)}

/* main */
.main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:8px;min-height:0}
.main.noinsp{grid-template-columns:minmax(0,1fr)}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:8px;min-height:0;display:flex;flex-direction:column;overflow:hidden;position:relative}
.pane-h{display:flex;align-items:center;gap:8px;padding:6px 12px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.crumb{font-family:var(--mono);font-size:11px;color:var(--ink3);display:flex;gap:5px;flex-wrap:wrap}
.crumb b{color:var(--ink);font-weight:500}
.pane-h .r{margin-left:auto;display:flex;gap:6px;align-items:center}
.pane-b{overflow:auto;padding:12px 14px;display:grid;gap:12px;align-content:start;min-height:0;flex:1}
.pane-b>*{min-width:0}
.lbl{font:600 10.5px var(--cond);letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)}
.itabs{display:flex;gap:2px}
.itabs button{border:0;background:transparent;border-radius:4px;padding:2px 8px;font:600 11px var(--cond);letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.itabs button[aria-pressed="true"]{background:var(--raise);color:var(--ink);box-shadow:0 0 0 1px var(--line)}

/* facts / verbs */
.facts{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12.5px;margin:0}
.facts dt{color:var(--ink3);font-family:var(--cond)}
.facts dd{margin:0}
.verbs{display:grid;gap:3px}
.verb{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;border:1px solid var(--line2);background:var(--raise);border-radius:5px;padding:4px 8px;text-align:left;font:500 13px var(--cond);width:100%}
.verb:hover{border-color:var(--ink3)}
.verb.pri{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.verb.pri .k{background:transparent;color:var(--ground);border-color:var(--ground)}
.verb[disabled]{opacity:1;cursor:not-allowed;background:transparent;border-style:dashed;color:var(--ink3)}
.verb .why{grid-column:1/-1;font:400 11.5px var(--ui);color:var(--ink3)}
.verb .why b{color:var(--wait)}

/* fleet */
.lane{display:grid;gap:1px}
.lane-h{display:flex;gap:10px;align-items:baseline;font:13px var(--cond);padding-block:2px}
.lane-h b{font-weight:700;font-size:13.5px}
.lane-h .clk{font-family:var(--mono);font-size:10.5px;color:var(--ink3)}
.run{display:grid;grid-template-columns:30px minmax(110px,200px) minmax(150px,1fr) minmax(110px,190px) 44px;gap:10px;align-items:center;padding:3px 6px;border-radius:5px;border:1px solid transparent;text-align:left;background:transparent;width:100%;font:13px var(--cond);transition:opacity .3s}
.run:hover{background:var(--panel2)}
.run[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft);opacity:1}
.run.dark{opacity:var(--dim)}
.run.dark:hover{opacity:1}
.run .id{font-family:var(--mono);font-size:11px;color:var(--ink3)}
.run .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.run .st{color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.run .st.bad{color:var(--bad);font-weight:600} .run .st.wait{color:var(--wait);font-weight:600}
.run .who{font-family:var(--mono);font-size:10.5px;color:var(--ink3);text-align:right}
.run.term .nm{font-family:var(--mono);font-weight:500;font-size:11.5px}
.dep{font-family:var(--mono);font-size:10px;color:var(--ink3);padding-left:46px}
.dep.lit{color:var(--wait);font-weight:600}
.lane-sep{height:1px;background:var(--line2);margin-block:5px}
.bracket{border-left:2px solid var(--ghost);margin-left:2px;padding-left:4px}
.bracket-l{font:600 10px var(--mono);color:var(--ghost);padding-left:8px}

/* mini rail */
.mr{display:flex;align-items:center;height:16px;min-width:0}
.mr .sg{flex:1;height:2px;background:var(--line);min-width:5px}
.mr .sg.d{background:var(--ink2)}
.nd{width:9px;height:9px;border-radius:50%;border:2px solid var(--ink3);background:var(--panel);flex:none}
.nd.d{background:var(--ink2);border-color:var(--ink2)}
.nd.a{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.nd.f{background:var(--bad);border-color:var(--bad)}
.nd.s{border-color:var(--bad);border-style:dashed}
.dm{width:9px;height:9px;transform:rotate(45deg);border:2px solid var(--ink3);background:var(--panel);flex:none;margin-inline:1px}
.dm.w{background:var(--wait);border-color:var(--wait)}
.dm.p{background:var(--ok);border-color:var(--ok)}
.dm.x{background:var(--bad);border-color:var(--bad)}
.mk{font-size:10px;margin-left:4px}
.mk.w{color:var(--wait)} .mk.x{color:var(--bad)}

/* plan graph */
.meter{display:flex;gap:10px 18px;align-items:center;flex-wrap:wrap;padding:8px 12px;border:1px solid var(--line2);border-radius:7px;background:var(--raise)}
.score{font-family:var(--mono);font-size:26px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.score small{font-size:11px;color:var(--ink3);font-weight:400}
.band{display:flex;height:6px;width:180px;border-radius:3px;overflow:hidden;position:relative;background:var(--line2)}
.band i{display:block;height:100%}
.band .pin{position:absolute;top:-4px;width:2px;height:14px;background:var(--ink)}
.band .pin.g{background:var(--ghost)}
.reasons{font-size:12px;color:var(--ink2);flex:1;min-width:200px}
.pill{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:10px;padding:0 7px;font:600 11px/1.6 var(--cond);background:var(--panel);white-space:nowrap}
.pill.bad{color:var(--bad);border-color:var(--bad);background:var(--bad-soft)}
.pill.wait{color:var(--wait);border-color:var(--wait);background:var(--wait-soft)}
.pill.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
.pill.ghost{color:var(--ghost);border-color:var(--ghost);background:var(--ghost-soft)}
.pill.acc{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.chips{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--raise);border-radius:5px;padding:1px 8px;font:12px var(--cond)}
.chip b{font-weight:600}
.pgwrap{overflow-x:auto;padding-bottom:4px}
.pg{display:flex;align-items:flex-start;gap:0;min-width:max-content}
.mon{display:flex;gap:8px;flex-wrap:wrap;font:12px var(--cond);color:var(--ink2);margin-bottom:6px}
.mon span{border:1px dashed var(--line);border-radius:12px;padding:0 8px;background:var(--panel)}
.ph{width:160px;display:grid;gap:5px}
.ph-h{display:flex;gap:6px;align-items:center;font:600 12px var(--cond);text-transform:uppercase;letter-spacing:.06em;border-bottom:2px solid var(--line);padding-bottom:3px}
.ph-h .lock{font-size:10px;color:var(--ink3)}
.ph.done .ph-h{border-color:var(--ink2)} .ph.act .ph-h{border-color:var(--accent);color:var(--accent)}
.ph.ghost .ph-h{border-color:var(--ghost);color:var(--ghost);border-bottom-style:dashed}
.ph .late{font:600 9.5px var(--mono);color:var(--ghost)}
.car{border:1px solid var(--line2);background:var(--raise);border-radius:5px;padding:4px 7px;font:12px/1.35 var(--cond);display:grid;gap:1px;text-align:left;width:100%}
.car .o{font-family:var(--mono);font-size:10.5px;color:var(--ink3);display:flex;gap:6px;justify-content:space-between}
.car.act{border-color:var(--accent)}
.car.stall{border-color:var(--bad);border-style:dashed}
.car.ghost{border-color:var(--ghost);border-style:dashed;background:var(--ghost-soft)}
.car.q{color:var(--ink3)}
.car[aria-selected="true"]{box-shadow:0 0 0 2px var(--accent)}
.flag{font:600 11px var(--cond);color:var(--bad)}
.flag.w{color:var(--wait)}
.gcol{width:42px;display:grid;justify-items:center;gap:2px;padding-top:2px}
.gd{width:14px;height:14px;transform:rotate(45deg);border:2px solid var(--ink3);background:var(--panel)}
.gd.w{background:var(--wait);border-color:var(--wait)}
.gd.p{background:var(--ok);border-color:var(--ok)}
.gd.x{background:var(--bad);border-color:var(--bad)}
.gd.g{border-color:var(--ghost);border-style:dashed}
.gcol .gk{font:9.5px var(--mono);color:var(--ink3);text-align:center;line-height:1.1}
.comms{font:12.5px var(--cond);color:var(--ink2);border-top:1px dashed var(--line);padding-top:6px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* generic blocks */
.card{border:1px solid var(--line2);background:var(--raise);border-radius:7px;padding:10px 12px;display:grid;gap:6px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--raise);border-radius:5px;padding:3px 10px;font:600 12.5px var(--cond)}
.btn.pri{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.btn.acc{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.note{font-size:12px;color:var(--ink3)}
.split{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:12px}
.cmp{display:grid;grid-template-columns:minmax(150px,190px) minmax(0,1fr);gap:12px}
.tbl-wrap{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;font:12.5px var(--cond)}
table.t th{font:600 10.5px var(--cond);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);text-align:left;padding:4px 8px;border-bottom:1px solid var(--line)}
table.t td{padding:4px 8px;border-bottom:1px solid var(--line2);white-space:nowrap}
table.t td.w{white-space:normal}
table.t tr.grey td{opacity:.45;text-decoration:line-through}
.overlay{position:absolute;inset:0;background:color-mix(in srgb,var(--ground) 55%,transparent);display:grid;place-items:start center;padding:18px 12px;overflow:auto;z-index:3}
.sheet{background:var(--raise);border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow);width:min(720px,100%);padding:14px 16px;display:grid;gap:10px}
.sheet h2{margin:0;font:700 17px var(--cond)}
.hsec{display:grid;grid-template-columns:96px 1fr;gap:4px 10px;font-size:13px}
.hsec dt{font:600 10.5px/1.9 var(--cond);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.hsec dd{margin:0}
.hsec dd .a{font-family:var(--mono);font-size:10.5px;color:var(--accent)}
.bt{display:flex;gap:10px;align-items:center;padding:8px 12px;border-radius:7px;background:var(--bad-soft);border:1px solid var(--bad);font:13px var(--cond);flex-wrap:wrap;animation:slide .35s ease-out}
@keyframes slide{from{transform:translateY(-8px);opacity:.3}to{transform:none;opacity:1}}
.bt .s{flex:1;min-width:220px}
.doc{font:15px/1.65 Georgia, "Times New Roman", serif;max-width:68ch;color:var(--ink)}
.doc h3{font:700 16px var(--ui);margin:0 0 6px}
.doc p{margin:0 0 10px}
.doc .cur{background:var(--accent-soft);box-shadow:-3px 0 0 var(--accent)}
.claim{border-bottom:1px dotted var(--ok)}
.claim.bad{border-bottom:2px solid var(--bad);background:var(--bad-soft)}
.cid{font:600 10px var(--mono);color:var(--ok);vertical-align:super}
.say{border:1px solid var(--line2);border-radius:6px;padding:6px 8px;background:var(--raise);font:12.5px/1.4 var(--cond);display:grid;gap:2px}
.say .h{display:flex;gap:6px;align-items:center;font-size:11.5px;color:var(--ink3);flex-wrap:wrap}
.say .h b{color:var(--ink)}
.murmur{font:12px var(--mono);color:var(--ink3);border:1px dashed var(--line);border-radius:6px;padding:5px 8px;display:grid;gap:2px}
.term{background:#0B0F14;color:#CFE3D6;font:12px/1.5 var(--mono);border-radius:6px;padding:8px 10px;overflow-x:auto;white-space:pre}
.term .p{color:#7FD3DF}
.term .dim{color:#6E7A86}
.ev{font:11px/1.55 var(--mono);display:grid;gap:1px}
.ev div{display:grid;grid-template-columns:62px 1fr;gap:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .ts{color:var(--ink3)}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.col{border:1px solid var(--line2);border-radius:6px;padding:6px 8px;background:var(--raise);font:12.5px/1.4 var(--cond);display:grid;gap:3px;align-content:start}
.col .seat{font:600 11px var(--mono);color:var(--accent)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.tile{border:1px solid var(--line2);border-radius:6px;padding:7px 9px;background:var(--raise);display:grid;gap:2px;font:12.5px var(--cond)}
.tile .v{font:600 20px var(--mono)}
.tile.ghost{border-color:var(--ghost);border-style:dashed;background:var(--ghost-soft)}
.tile.dark{opacity:.6}
.tile.lit{border-color:var(--wait)}
.dag{width:100%;height:auto;max-width:640px}
.strike{text-decoration:line-through;color:var(--bad)}
.log{display:grid;gap:6px}
.log .day{font:600 10.5px var(--mono);color:var(--ink3);padding-top:6px}
.le{display:grid;grid-template-columns:48px 70px 1fr;gap:8px;font:12.5px/1.4 var(--cond);align-items:baseline}
.le .ts{font:10.5px var(--mono);color:var(--ink3)}
.le .ty{font:600 10px var(--mono);text-transform:uppercase;color:var(--ink3)}
.le .ty.say{color:var(--accent)}

/* talk drawer + command line */
.drawer{border:1px solid var(--line);background:var(--raise);border-radius:8px;max-height:260px;overflow:auto;padding:8px 12px;display:grid;gap:8px;box-shadow:var(--shadow)}
.dh{display:flex;gap:8px;align-items:center;font:600 10.5px var(--cond);letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)}
.dh .r{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:500}
.msg{display:grid;grid-template-columns:70px 1fr;gap:8px;font:13px/1.4 var(--cond)}
.msg .w{font:600 11px var(--mono);color:var(--ink3);padding-top:2px}
.msg.me .w{color:var(--ink)}
.oc{display:inline-flex;gap:4px;align-items:center;font:600 10px var(--mono);text-transform:uppercase;letter-spacing:.05em;border-radius:3px;padding:0 5px;border:1px solid}
.oc.answer{color:var(--ink2);border-color:var(--line)}
.oc.intent{color:var(--accent);border-color:var(--accent)}
.oc.compose{color:var(--ghost);border-color:var(--ghost)}
.oc.steer{color:var(--wait);border-color:var(--wait)}
.prop{border:1px dashed var(--ghost);background:var(--ghost-soft);border-radius:6px;padding:6px 8px;display:grid;gap:4px;font:12.5px var(--cond)}
.cmd{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--ink);background:var(--raise);border-radius:8px;padding:6px 10px}
.prompt{font:600 13px var(--mono);color:var(--accent);white-space:nowrap;max-width:46vw;overflow:hidden;text-overflow:ellipsis}
.cmd input{border:0;background:transparent;outline:none;font:13px var(--mono);width:100%;min-width:0}
.cmd .side{display:flex;gap:8px;align-items:center;font:12px var(--cond);color:var(--ink3);flex-wrap:wrap;justify-content:flex-end}
.undo{display:flex;gap:6px;align-items:center;font:600 12px var(--cond);color:var(--ink)}
.undo .bar{width:60px;height:4px;background:var(--line2);border-radius:2px;overflow:hidden}
.undo .bar i{display:block;height:100%;background:var(--accent);transition:width 1s linear}
.status{font:12px var(--cond);color:var(--ok)}

/* ---------- desktop: one-screen app ---------- */
@media (min-width:960px){

}

<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------------- shared data ---------------- */
function rail(spec){
  const t=spec.split(" ");let h='<span class="mr" aria-hidden="true">';
  t.forEach((x,i)=>{
    if(i>0){const prev=t[i-1];h+='<i class="sg'+(prev==="d"||prev==="+"?" d":"")+'"></i>';}
    if(x==="d")h+='<i class="nd d"></i>';else if(x==="a")h+='<i class="nd a"></i>';else if(x==="f")h+='<i class="nd f"></i>';
    else if(x==="s")h+='<i class="nd s"></i>';else if(x==="o")h+='<i class="nd"></i>';
    else if(x==="!")h+='<i class="dm w"></i>';else if(x==="+")h+='<i class="dm p"></i>';else if(x==="x")h+='<i class="dm x"></i>';else if(x==="<")h+='<i class="dm"></i>';
  });

}
const LANES=[
 {eng:"Northwind Bank",key:"northwind",clk:"RFP due Fri 17:00 · 2d 8h",runs:[
  {id:"N1",nm:"§4 Security & Resilience",rail:"d d + d ! o",st:"unit review · waits on you",cls:"wait",who:"cl cx",mark:"w",alike:false,kind:"unit_review"},
  {id:"N2",nm:"§5 Data residency",rail:"d d + d ! o",st:"unit review · LOW · pass",cls:"low",who:"cl cx",mark:"w",alike:true,kind:"unit_review"},

  {id:"N4",nm:"§7 Operational resilience",rail:"! o o o o",st:"plan approval · 41",cls:"wait",who:"pa",mark:"w",kind:"plan_approval"}]},
 {eng:"Helix Payments",key:"helix",clk:"change freeze 17:00",runs:[
  {id:"H1",nm:"ledger-migration",rail:"d d a o o <",st:"HIGH finding · council NO 3–1",cls:"bad",who:"cx pi cp",mark:"x",kind:"team_dispute"},
  {id:"H2",nm:"PostEntry contract tests",rail:"o o o <",st:"queued",dark:true,who:"cp",dep:"◂ waits on H1 build",deplit:true},
  {id:"H3",nm:"settlement rounding fix",rail:"d d d + d !",st:"deliver gate",cls:"wait",who:"cx",mark:"w",kind:"deliver"},
  {id:"H4",nm:"refund idempotency",rail:"d d + d ! o",st:"unit review · LOW · pass",cls:"low",who:"cx cl",mark:"w",alike:true,kind:"unit_review"},
  {id:"H5",nm:"fee schedule parser",rail:"d d + d ! o",st:"unit review · LOW · pass",cls:"low",who:"oc cl",mark:"w",alike:true,kind:"unit_review"},
  {id:"T1",nm:"term · helix-core/H1 · zsh",term:true,st:"shell in worktree · opened 2h ago",dark:true,who:"you"}]},

  {id:"O1",nm:"returns-triage exec demo",rail:"d a s o o <",st:"stalled 22m · opencode benched",cls:"bad",who:"oc cl",mark:"x",kind:"escalation"},
  {id:"O2",nm:"seed catalog fixtures",rail:"d d + d ! o",st:"unit review · LOW · pass",cls:"low",who:"cx cl",mark:"w",alike:true,kind:"unit_review"}]},
 {eng:"House",key:"house",clk:"",collapsed:"House · 1 run · on pace (POV paper “Evaluators you can’t bribe”)",runs:[
  {id:"P1",nm:"POV paper",rail:"d d a o o",st:"working",dark:true,who:"cl"}]}
];
const RUNS={};LANES.forEach(l=>l.runs.forEach(r=>{r.eng=l.eng;r.key=l.key;RUNS[r.id]=r;}));

function fleet(o){
  o=o||{};const sel=o.sel||[];let h="";
  LANES.forEach((l,i)=>{
    if(i)h+='<div class="lane-sep"></div>';
    if(l.collapsed&&!o.expandHouse){h+='<div class="lane"><div class="lane-h"><span class="muted">'+esc(l.collapsed)+'</span></div></div>';return;}
    h+='<div class="lane"><div class="lane-h"><b>'+esc(l.eng)+'</b><span class="clk">'+esc(l.clk)+'</span></div>';
    const inCamp=o.campaign&&l.key==="helix";
    l.runs.forEach(r=>{
      if(inCamp&&r.id==="H2")h+='<div class="bracket-l">campaign “PostEntry consumers” · 4 plans · human_gate_on_failure · concurrency 2</div><div class="bracket">';
      const dark=r.dark&&!sel.includes(r.id);
      const grey=o.grey&&o.grey.includes(r.id);
      let st=r.st,cls=r.cls||"";
      if(o.focusMarks&&r.mark){st=r.mark==="x"?st:"held";cls=r.mark==="x"?"bad":"";}
      h+='<button type="button" class="run'+(dark?" dark":"")+(r.term?" term":"")+'" data-act="sel" data-id="'+r.id+'" aria-selected="'+sel.includes(r.id)+'"'+(grey?' style="opacity:.35"':'')+'>'
        +'<span class="id">'+r.id+'</span><span class="nm">'+esc(r.nm)+'</span>'
        +(r.term?'<span class="mr"><span class="mono muted">› cargo test -p ledger</span></span>':rail(r.rail))
        +'<span class="st '+(cls==="low"?"":cls)+'">'+esc(st)+((o.marks||o.focusMarks)&&r.mark?'<span class="mk '+r.mark+'">◆</span>':'')+'</span>'
        +'<span class="who">'+esc(r.who||"")+'</span></button>';
      if(r.dep)h+='<div class="dep'+(r.deplit?" lit":"")+'">'+esc(r.dep)+(r.deplit?" · upstream waits on you":"")+'</div>';
      if(inCamp&&r.id==="H2")h+='<button type="button" class="run dark"><span class="id">C2</span><span class="nm">settlements consumer tests</span>'+rail("o o o <")+'<span class="st">queued</span><span class="who">cp</span></button><button type="button" class="run dark"><span class="id">C3</span><span class="nm">refunds consumer tests</span>'+rail("o o o <")+'<span class="st">queued</span><span class="who">pi</span></button><button type="button" class="run dark"><span class="id">C4</span><span class="nm">reporting consumer tests</span>'+rail("o o o <")+'<span class="st">queued</span><span class="who">oc</span></button></div>';
    });
    h+='</div>';
  });
  return h;
}

/* strips */
const S={
 H1:{id:"H1",sev:"bad",g:"▲",clock:"blocks 2 runs",eng:"Helix",dec:"H1 dispute: council NO 3–1 on pi’s tenant_id finding",eff:"side / accept / re-convene",who:"PA claude · pi",keys:[["side","c"]]},
 N1:{id:"N1",sev:"wait",g:"◆",clock:"Fri 17:00 · 2d",eng:"Northwind",dec:"N1 §4 unit review · 41/42 claims anchored",eff:"approve → unblocks N3",who:"eval codex ≠ claude",keys:[["approve","a"]]},
 O1:{id:"O1",sev:"bad",g:"▲",clock:"quiet 22m",eng:"Orbital",dec:"O1 seed step stalled · opencode benched",eff:"reassign → restarts step 3",who:"PA claude",keys:[["reassign","s"]]},

function boardHtml(list,o){
  o=o||{};
  let h='<div class="bhead">Needs you · ranked by consequence<span class="r">'+(o.right||'<span class="k">j</span> <span class="k">k</span> move · <span class="k">Space</span> peek · <span class="k">⏎</span> open')+'</span></div>';

/* ---------------- state ---------------- */
let cur=0, st={}, undoT=null;
function reset(){st={};if(undoT){clearInterval(undoT);undoT=null;}}
function startUndo(label,after){
  if(undoT)clearInterval(undoT);
  st.undo={label:label,n:10};
  undoT=setInterval(()=>{
    if(!st.undo){clearInterval(undoT);undoT=null;return;}
    st.undo.n--;

}

M.push({id:"fleet",t:"09:05",name:"Supervising the fleet",eng:"fleet",posture:"open",

 board:s=>boardHtml(s.done?["N4","H3",{id:"PR"}]:["N4","H3"],{more:s.done?"proposal lands at 17:30 in the evening lane":"+1 ranked below"}),
 canvas:s=>canvasHead("fleet › northwind › N1 › finding f1 › <b>capture</b>","")
  +'<div class="pane-b"><div class="split"><div class="card"><span class="lbl">Pattern · crosses engagements</span><p style="margin:0">RTO/RPO claims in a resilience answer must cite a control ID, or be removed. Test results quoted must match the most recent test report.</p><p class="muted" style="margin:0;font-size:12.5px">Source text: “<span class="strike">Northwind</span>’s <span class="strike">card authorisation</span> fails over in <span class="strike">under 15 minutes</span>, verified in the <span class="strike">June regional test</span>” · raised by codex, confirmed by <span class="strike">Priya Raman (CISO)</span> in <span class="strike">INC-40213</span>.</p></div>'
  +'<div class="card"><span class="lbl">Client detail · stays in Northwind</span><ul style="margin:0;padding-left:18px;font-size:13px"><li>Northwind Bank, card authorisation service</li><li>June regional failover: 2 h 41 m</li><li>Priya Raman, CISO</li><li>INC-40213</li></ul><span class="note">Boundary: 14 client terms · patterns may be shared</span></div></div>'
  +'<div class="chips"><span class="lbl">Target</span>'+["steering rule · compliance","memory · pattern","preset step · rfp-section","eval sample · fin-claims-v4"].map((t,i)=>'<button type="button" class="chip" data-act="tgt" data-arg="'+i+'"'+((s.tgt||0)===i?' style="border-color:var(--accent);color:var(--accent);font-weight:600"':'')+'>'+t+'</button>').join("")+'</div>'
  +'<div class="row"><button type="button" class="btn pri" data-act="prop"'+(s.done?" disabled":"")+'>Propose <span class="k">⏎</span></button>'+(s.done?'<span class="status">Proposal P-118 created · POST /proposals · appears as a strip at 17:30</span>':'<span class="note">Nothing is written until the proposal is approved.</span>')+'</div></div>',
 insp:null,
 acts:{tgt:(s,el)=>{s.tgt=Number(el.dataset.arg);},prop:s=>{s.done=true;}}
});

/* M14 Deliver */
M.push({id:"deliver",t:"16:45",name:"Delivering and outbound",eng:"helix",posture:"open",
 why:"H3 is ready to leave the machine. A push can’t be undone, and the platform lead wants a note.",
 see:"The deliver gate: diffstat, target, acceptance verdict. The outbound draft is written from the work. Mail and Message are shown but wait for the first integration.",
 doo:"Type <span class='mono'>deliver H3</span> to enable <b>Deliver</b>. Press <b>Copy</b> on the draft.",
 prompt:()=>"helix/H3#deliver ›",
 board:s=>boardHtml([s.done?{id:"H3",grey:true}:{id:"H3",sel:true},"N4","O1"],{more:""}),
 canvas:s=>canvasHead("fleet › helix › H3 settlement rounding fix › <b>deliver gate</b>",'<span class="pill ok">acceptance pass</span>')
  +'<div class="pane-b">'+facts([["Target","PR into helix/settlement · main"],["Diffstat","4 files · +61 −18"],["Evaluator","claude ≠ creator codex"],["Acceptance","6 of 6 items with evidence"]])
  +'<div class="ev">'+["M settlement/round.rs  +22 −11","M settlement/fx.rs  +9 −4","A settlement/tests/banker_rounding.rs  +28","M CHANGELOG.md  +2 −3"].map(f=>'<div><span class="ts">diff</span><span>'+esc(f)+'</span></div>').join("")+'</div>'
  +'<div class="card"><span class="lbl">Typed confirm · a push can’t be undone</span><div class="row"><input id="dconf" type="text" aria-label="Type deliver H3" placeholder="type: deliver H3" style="border:1px solid var(--line);border-radius:5px;padding:3px 8px;background:var(--panel);font:13px var(--mono)" value="'+esc(s.typed||"")+'"><button type="button" class="btn pri" data-act="deliver"'+(s.typed==="deliver H3"&&!s.done?"":" disabled")+'>Deliver <span class="k">d</span></button>'+(s.done?'<span class="status">Pushed · PR #418 opened</span>':'')+'</div></div></div>',
 insp:s=>insp("Outbound draft · from H3",'<div class="card" id="odraft" style="font-size:13px">Hi Marco, the settlement rounding fix is up for review as PR #418 into settlement/main. It switches FX conversion to banker’s rounding, which removes the 1-cent drift you saw on EUR→SEK batches. 28 new tests cover the edge cases; acceptance passed 6 of 6. No API changes. We can merge before tonight’s 17:00 freeze if your team signs off.</div>'
  +'<div class="verbs">'+verb("Copy","",{pri:true,act:"copy"})+verb("Send by mail","",{dis:true,why:"arrives with the first integration"})+verb("Send as message","",{dis:true,why:"arrives with the first integration"})+'</div>'+(s.copied?'<span class="status">'+esc(s.copied)+'</span>':''),'<span class="itabs"><button type="button" aria-pressed="true">Draft</button></span>'),
 acts:{deliver:s=>{s.done=true;},copy:s=>{const t=$("#odraft").textContent;s.copied="Copied to clipboard";try{navigator.clipboard.writeText(t).catch(()=>{s.copied="Select the text to copy";render();});}catch(e){s.copied="Select the text to copy";}}}
});

/* M15 Away */
M.push({id:"away",t:"18:05",name:"Leaving with standing orders",eng:"fleet",posture:"away",
 why:"You are leaving. The fleet keeps running. You decide now what it may do without you, and for how long.",
 see:"The overnight sheet: what keeps running, what will wait for you, and each order with its rule, expiry and what it would have done today. Outbound is queued, never sent.",
 doo:"Press <b>Add order</b> to see a Talk sentence become a parsed order with a preview, then commit.",
 prompt:()=>"fleet · away ›",
 board:()=>'<div class="held"><span class="c-ghost">● Away</span><b>4 held</b><span>marks stay on the rails · orders act on LOW items only</span></div>',
 drawer:s=>s.add?'<div class="dh">Talk · fleet › · compose</div><div class="msg me"><span class="w">you</span><span>While I’m away, approve LOW unit reviews on Helix with no findings until Friday; wake me for any HIGH; draft the Northwind status at 17:00 tomorrow.</span></div><div class="msg"><span class="w">PA · claude</span><div class="prop"><span><span class="oc compose">compose</span> 3 orders</span><span class="mono" style="font-size:11.5px">1 gate.kind=unit_review ∧ band=LOW ∧ findings=0 ∧ engagement=helix → approve · expires Fri 18:00 · would have approved 4 today<br>2 finding.severity=high → desktop notify · expires on return<br>3 at Fri 17:00 → draft status to Priya Raman from N1–N4 · <b>queued, not sent</b> (no send policy)</span><div class="row"><button type="button" class="btn pri" data-act="addok"'+(s.addok?" disabled":"")+'>Commit 3 orders <span class="k">⏎</span></button>'+(s.addok?'<span class="status">Orders in force: 5 · tomorrow’s handover reports what each did</span>':'')+'</div></div></div>':"",
 canvas:s=>canvasHead("<b>away</b> · overnight sheet · Thu 18:05 → Fri 08:30","")
  +'<div class="pane-b"><div class="split"><div class="card"><span class="lbl">Keeps running</span><span>H1 security review (pi) · campaign “PostEntry consumers” C2–C4 · N3 compliance matrix · O1 record · P1 POV paper</span><span class="lbl">Will wait for you</span><span>N4 plan approval · C1 plan approval · any deliver gate · H1 plan_approval (rev 3) · anything HIGH</span><span class="note">Orders never answer plan approval or deliver gates.</span></div>'
  +'<div class="card"><span class="lbl">Orders in force</span>'
  +'<div class="say"><span class="h"><b>Northwind docs under band 40</b> · expires Fri 18:00</span><span class="mono" style="font-size:11px">plan_approval? no · unit_review ∧ band&lt;40 ∧ findings=0 → approve</span><span class="muted">would have approved 2 today</span></div>'
  +'<div class="say"><span class="h"><b>Orbital outbound</b> · expires Sun</span><span class="mono" style="font-size:11px">outbound → queue, never send</span><span class="muted">would have queued 1 draft</span></div>'
  +'<button type="button" class="btn" data-act="add">Add order</button></div></div>'
  +fleet({focusMarks:true})+'</div>',
 insp:null,
 acts:{add:s=>{s.add=true;},addok:s=>{s.addok=true;}}
});

/* ---------------- rendering ---------------- */
const ENGS=[["fleet","Fleet",""],["northwind","Northwind Bank","◆"],["helix","Helix Payments","▲"],["orbital","Orbital Retail","▲"],["house","House",""]];
function renderEbar(m){
  const g={"◆":"c-wait","▲":"c-bad"};
  let h=ENGS.map(e=>'<button type="button" class="etab" aria-current="'+(m.eng===e[0])+'" data-act="eng" data-arg="'+e[0]+'">'+e[1]+(e[2]?'<span class="g '+g[e[2]]+'">'+e[2]+'</span>':'')+'</button>').join("")+'<button type="button" class="etab" title="New engagement asks for its confidentiality boundary">+</button>';
  h+='<span class="grow"></span><div class="posture" role="group" aria-label="Posture">'+[["open","Open"],["focus","Focus"],["away","Away"]].map(p=>'<button type="button" aria-pressed="'+(m.posture===p[0])+'" data-act="posture" data-arg="'+p[0]+'">'+p[1]+'</button>').join("")+'</div>';
  h+='<div class="tray"><span class="lit">seats 4/5</span><span>bus ok</span><span>dead letters 0</span><span class="tab">$18.40 today</span><span>orders 3</span></div>';
  $("#ebar").innerHTML=h;
}
function renderCmd(){
  const m=M[cur];
  $("#prompt").textContent=m.prompt(st);
  let side="";
  if(st.undo)side+='<span class="undo">'+esc(st.undo.label)+' <span class="bar"><i style="width:'+(st.undo.n*10)+'%"></i></span><span class="tab">'+st.undo.n+'s</span><button type="button" class="sbtn" data-act="undo">undo <span class="k">u</span></button></span>';
  else if(st.sent)side+='<span class="status">✓ '+esc(st.sent)+'</span>';
  if(m.drawer)side+='<span><span class="k">↑</span> Talk drawer</span>';
  side+='<span><span class="k">:</span> verb</span><span><span class="k">&gt;</span> raw</span><span><span class="k">⌘K</span></span>';
  $("#cmdside").innerHTML=side;
}
function render(){
  const m=M[cur];
  $("#moments").innerHTML=M.map((x,i)=>'<button type="button" class="mchip" data-go="'+i+'" aria-current="'+(i===cur)+'"><span class="t">'+x.t+'</span>'+(i+1)+'. '+x.name+'</button>').join("");
  $("#cap").innerHTML='<dt>Why</dt><dd>'+m.why+'</dd><dt>See</dt><dd>'+m.see+'</dd><dt>Do</dt><dd>'+m.doo+'</dd>';
  renderEbar(m);
  $("#board").innerHTML=m.board(st);
  $("#canvas").innerHTML=m.canvas(st);
  const ih=m.insp?m.insp(st):null;
  $("#insp").hidden=!ih; if(ih)$("#insp").innerHTML=ih;
  $("#mainz").classList.toggle("noinsp",!ih);
  const dh=m.drawer?m.drawer(st):"";
  $("#drawer").hidden=!dh; if(dh)$("#drawer").innerHTML=dh;
  const inp=$("#talk");
  if(m.prefill){const v=m.prefill(st);if(v)inp.value=v;}
  renderCmd();
  const chip=document.querySelector('.mchip[aria-current="true"]');
  if(chip&&chip.scrollIntoView)try{chip.scrollIntoView({block:"nearest",inline:"nearest"});}catch(e){}
}
function go(id){
  const i=typeof id==="number"?id:M.findIndex(m=>m.id===id);
  if(i<0||i>=M.length)return;
  cur=i;reset();$("#talk").value="";
  try{history.replaceState(null,"","#"+M[cur].id);}catch(e){}
  render();
}

document.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]");if(g){go(Number(g.dataset.go));return;}
  const a=e.target.closest("[data-act]");if(!a)return;
  const act=a.dataset.act,m=M[cur];
  if(act==="undo"){if(undoT){clearInterval(undoT);undoT=null;}go(cur);return;}
  if(act==="posture"){const p=a.dataset.arg;if(p==="focus")go("focus");else if(p==="away")go("away");else if(m.posture!=="open")go("fleet");return;}
  if(act==="eng"){const k=a.dataset.arg;const map={fleet:"fleet",northwind:"review",helix:"edit",orbital:"agents",house:"talk"};if(m.eng!==k)go(map[k]);return;}
  if(act==="goraw"){go("raw");return;}
  if(act==="strip"&&!e.target.closest("[data-act='skey']")){
    const id=a.dataset.id;const map={H1:"collide",N1:"review",O1:"agents",N4:"edit",G4:"bulk",H3:"deliver",PR:"capture"};
    if(m.acts&&m.acts.strip){m.acts.strip(st,a);render();return;}
    if(map[id]&&M[cur].id!==map[id])go(map[id]);return;}
  if(m.acts&&m.acts[act]){m.acts[act](st,a);render();return;}
  if(act==="skey"){const map={H1:"collide",N1:"review",O1:"agents",N4:"collide",G4:"bulk",H3:"deliver",PR:"capture"};const t=map[a.dataset.id];if(t&&t!==m.id)go(t);}
});
document.addEventListener("input",e=>{
  if(e.target.id==="dconf"){st.typed=e.target.value;const b=document.querySelector('[data-act="deliver"]');if(b)b.disabled=!(st.typed==="deliver H3"&&!st.done);}
});
$("#talk").addEventListener("keydown",e=>{
  if(e.key!=="Enter")return;
  const v=e.target.value.trim();if(!v)return;
  const m=M[cur];
  if(m.id==="review"&&st.amend){m.acts.send(st);e.target.value="";render();return;}
  st.sent=(v[0]===":"?"Verb "+v+" runs on the selection in the live console":v[0]===">"?"Raw target "+v+" opens in the inspector":"Sent to "+m.prompt(st).replace(" ›","")+" · the PA returns answer, intent, compose or steer")+" (scripted in this walk-through)";
  e.target.value="";renderCmd();
});
document.addEventListener("keydown",e=>{
  if(e.target.closest&&e.target.closest("input,textarea"))return;
  if(e.key==="]")go(Math.min(M.length-1,cur+1));
  else if(e.key==="[")go(Math.max(0,cur-1));
  else if(e.key==="u"&&st.undo){document.querySelector('[data-act="undo"]').click();}
  else if(e.key==="Escape"&&M[cur].id==="arrive"&&!st.dismissed){st.dismissed=true;render();}
});
$("#prev").addEventListener("click",()=>go(Math.max(0,cur-1)));
$("#next").addEventListener("click",()=>go(Math.min(M.length-1,cur+1)));
let start=0;try{const h=(location.hash||"").slice(1);const i=M.findIndex(m=>m.id===h);if(i>=0)start=i;}catch(e){}
go(start);
})();
</script>
